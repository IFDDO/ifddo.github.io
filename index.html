<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>IFDDO Portal</title>


  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./IFDDO_apple-touch-icon_180.png"
  >


  <link
    rel="icon"
    type="image/png"
    href="./IFDDO_apple-touch-icon_180.png"
  >


  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="IFDDO Portal"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >


  <style>

    html,
    body {
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#141414;
      font-family:Arial, Helvetica, sans-serif;
    }


    #loadingScreen {
      position:fixed;
      inset:0;
      z-index:10;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      background:#141414;
      color:#ffffff;

      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }


    #loadingScreen.hidden {
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }


    .loading-logo {
      width:150px;
      height:150px;
      object-fit:cover;
      border-radius:30px;
      margin-bottom:22px;
    }


    .loading-title {
      font-size:30px;
      font-weight:700;
      letter-spacing:1px;
      margin-bottom:8px;
    }


    .loading-subtitle {
      color:#aaaaaa;
      font-size:14px;
      letter-spacing:0.8px;
      text-align:center;
      margin-bottom:24px;
    }


    .loading-bar {
      width:180px;
      height:4px;
      overflow:hidden;
      border-radius:10px;
      background:#333333;
    }


    .loading-bar-inner {
      width:45%;
      height:100%;
      border-radius:10px;
      background:#d32f2f;
      animation:loadingSlide 1.1s ease-in-out infinite alternate;
    }


    @keyframes loadingSlide {

      from {
        transform:translateX(-10%);
      }

      to {
        transform:translateX(135%);
      }

    }


    #ifddoPortal {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      border:0;
      background:#141414;
    }

  </style>

</head>


<body>

  <div id="loadingScreen">

    <img
      class="loading-logo"
      src="./IFDDO_apple-touch-icon_180.png"
      alt="IFDDO Portal"
    >

    <div class="loading-title">
      IFDDO
    </div>

    <div class="loading-subtitle">
      Inkster Fire Department Digital Operations
    </div>

    <div class="loading-bar">
      <div class="loading-bar-inner"></div>
    </div>

  </div>


  <iframe
    id="ifddoPortal"
    src="https://script.google.com/macros/s/AKfycbwEN1Ga3BqWCNPFQ7vVzeoHBfOtP5fyF-xAgiFmNPapX4g73w4TlYWCv-E9XkVNrMEnWA/exec"
    allow="clipboard-read; clipboard-write"
    onload="hideLoadingScreen()"
  ></iframe>


  <script>

    function hideLoadingScreen() {

      window.setTimeout(
        function () {

          document
            .getElementById(
              "loadingScreen"
            )
            .classList
            .add(
              "hidden"
            );

        },
        250
      );

    }

  </script>

</body>

</html>
