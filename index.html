<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>IFDDO Portal</title>

  <!-- iPhone / iPad Home Screen Icon -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./IFDDO_apple-touch-icon_180.png"
  >

  <!-- Standard Browser Icon -->
  <link
    rel="icon"
    type="image/png"
    href="./IFDDO_apple-touch-icon_180.png"
  >

  <!-- iOS Web App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IFDDO Portal">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- General Mobile Web App -->
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #141414;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 18px;
      color: #b5b5b5;
    }
  </style>

  <script>
    window.location.replace(
      "https://script.google.com/macros/s/AKfycbwEN1Ga3BqWCNPFQ7vVzeoHBfOtP5fyF-xAgiFmNPapX4g73w4TlYWCv-E9XkVNrMEnWA/exec"
    );
  </script>
</head>

<body>

  <div class="loading">
    <img
      class="logo"
      src="./IFDDO_apple-touch-icon_180.png"
      alt="IFDDO Portal"
    >

    <div class="title">
      IFDDO
    </div>

    <div class="subtitle">
      Inkster Fire Department Digital Operations
    </div>
  </div>

</body>
</html>
